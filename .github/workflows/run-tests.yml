name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        php: [8.2, 8.3, 8.4]
        laravel: ['11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]

        exclude:
          # Laravel 13 requires PHP 8.3+
          - laravel: '13.*'
            php: 8.2

        include:
          - laravel: '11.*'
            testbench: '9.*'

          - laravel: '12.*'
            testbench: '10.*'

          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: >
            dom, curl, libxml, mbstring, zip, pcntl,
            pdo, sqlite, pdo_sqlite, bcmath, soap,
            intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          TESTBENCH_VERSION="${{ matrix.testbench }}"

          # Testbench 9.0.x falls too low for the Laravel 11 prefer-lowest lane
          # and breaks before the test suite boots.
          if [ "${{ matrix.laravel }}" = "11.*" ] && [ "${{ matrix.stability }}" = "prefer-lowest" ]; then
            TESTBENCH_VERSION="^9.12"
          fi

          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${TESTBENCH_VERSION}" \
            --no-interaction \
            --no-update

          composer update \
            --${{ matrix.stability }} \
            --prefer-dist \
            --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit
